# Harbor v2.0 · Electron 45 + React 19 + Fastify 5 NSIS 打包白名单（已清除过期 harbor.html 引用）
appId: com.harbor.desktop
productName: Harbor
directories:
  output: dist-electron
  buildResources: electron/build-resources
files:
  - electron/**/*
  - frontend/app/dist/**/*
  - assets/harbor.ico
  - harbor.ico
  - harbor-icon.png
  - libs/**/*
  - VERSION
  - backend/prompts/**/*
  - backend/experts_builtin/**/*
  - server/src/**/*
  - server/package.json
  - server/node_modules/**/*
  - '!server/data/**/*'
  - '!server/test/**/*'
  - '!server/prisma/**/*'
  - '!server/prisma.config.ts'
asar: true
asarUnpack:
  - '**/*.node'
  - '**/*.wasm'
extraMetadata:
  version: 2.0.0
npmRebuild: false
win:
  icon: assets/harbor.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  runAfterFinish: true
  perMachine: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: false
  uninstallDisplayName: Harbor
  artifactName: ${productName}-Setup-${version}.${ext}
compression: normal
