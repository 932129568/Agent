name: Harbor Full-Stack CI (React 19 + Fastify 5)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fullstack-gates:
    name: 架构铁律 + 后端零环 + 构建 + 单测 + E2E
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装依赖（root / server / react）
        run: |
          npm ci --ignore-scripts
          npm --prefix server ci
          npm --prefix frontend/react ci
      - name: 前端十二条铁律（严格收口 + 零死文件）
        run: node frontend/app/tools/enforce-iron-laws.mjs --strict
      - name: 后端七项架构红线（零循环依赖 + 打包清单校验）
        run: node server/tools/check-backend-arch.mjs
      - name: React 19 生产压缩构建
        run: node frontend/app/build.mjs
      - name: 前端 L1 单元测试
        run: node --test frontend/app/tests/unit.test.mjs
      - name: 后端核心回归套件（Smoke / LocalProxy / CORS / Guard / Files / MCP）
        run: |
          node server/test/smoke.mjs
          node server/test/local-proxy.mjs
          node server/test/cors-preflight.mjs
          node server/test/guard.mjs
          node server/test/files.mjs
          node server/test/mcp.mjs
      - name: Playwright 真机端到端回归（Suite A-E）
        run: node frontend/app/tests/e2e-r3-regression.mjs
